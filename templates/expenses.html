<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
    <title>Expense Tracker - Expenses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0c0e1a;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            padding: 28px 20px;
            z-index: 100;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .sidebar .logo .icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }

        .sidebar .logo h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar .logo h2 span {
            font-weight: 300;
            opacity: 0.7;
        }

        .sidebar .nav {
            list-style: none;
        }

        .sidebar .nav li {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 4px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar .nav li a {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .sidebar .nav li i {
            width: 20px;
            font-size: 16px;
        }

        .sidebar .nav li:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.8);
        }

        .sidebar .nav li.active {
            background: rgba(99, 102, 241, 0.12);
            color: #a78bfa;
            border: 1px solid rgba(99, 102, 241, 0.08);
        }

        .sidebar .nav li.logout {
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
            color: rgba(255, 255, 255, 0.3);
        }

        .sidebar .nav li.logout:hover {
            color: #f87171;
        }

        /* Main Content */
        .main-content {
            margin-left: 240px;
            padding: 32px 40px 40px 40px;
            min-height: 100vh;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 0.4s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .top-bar .greeting h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .top-bar .greeting h1 span {
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .top-bar .greeting p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            margin-top: 2px;
        }

        .top-bar .user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar .user .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .top-bar .user .name {
            font-size: 14px;
            font-weight: 500;
        }

        /* Filter Section */
        .filter-section {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 4px 10px 4px 12px;
            transition: all 0.3s ease;
        }

        .filter-group:focus-within {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.04);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.06);
        }

        .filter-group .label {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group .icon {
            color: rgba(255, 255, 255, 0.1);
            font-size: 12px;
        }

        .filter-group input[type="date"] {
            background: transparent;
            border: none;
            padding: 8px 4px;
            color: #fff;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            outline: none;
            width: 130px;
        }

        .filter-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.4;
            cursor: pointer;
        }

        .filter-group input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 0.8;
        }

        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn.apply {
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            color: #fff;
        }

        .filter-btn.apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .filter-btn.reset {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
        }

        .filter-btn.reset:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .filter-info {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            margin-left: auto;
        }

        .filter-info span {
            color: #a78bfa;
            font-weight: 600;
        }

        .quick-filters {
            display: flex;
            gap: 4px;
        }

        .quick-filter {
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-filter:hover {
            border-color: rgba(99, 102, 241, 0.3);
            color: #a78bfa;
        }

        .quick-filter.active {
            background: rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.2);
            color: #a78bfa;
        }

        /* Table */
        .table-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .table-header .title {
            font-size: 16px;
            font-weight: 600;
        }

        .table-header .total {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
        }

        .table-header .total span {
            color: #a78bfa;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        th {
            text-align: left;
            padding: 12px 8px;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 8px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .category-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .category-badge.food { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
        .category-badge.bills { background: rgba(99, 102, 241, 0.1); color: #a78bfa; }
        .category-badge.shopping { background: rgba(52, 211, 153, 0.1); color: #34d399; }
        .category-badge.transport { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
        .category-badge.entertainment { background: rgba(244, 63, 94, 0.1); color: #f43f5e; }
        .category-badge.health { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .category-badge.education { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; }
        .category-badge.rent { background: rgba(251, 146, 60, 0.1); color: #fb923c; }
        .category-badge.other { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.5); }

        .amount {
            font-weight: 600;
        }

        .amount.negative { color: #f87171; }
        .amount.positive { color: #34d399; }

        .action-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .action-btn:hover {
            color: #a78bfa;
            background: rgba(99, 102, 241, 0.08);
        }

        .action-btn.delete:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.08);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.2;
        }

        .empty-state h3 {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                width: 100%;
            }
            .filter-group input[type="date"] {
                width: 100%;
            }
            .filter-info {
                margin-left: 0;
                text-align: center;
            }
            th, td {
                font-size: 12px;
                padding: 8px 4px;
            }
            .table-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <div class="icon"><i class="fas fa-wallet"></i></div>
            <h2>Expense<span>Tracker</span></h2>
        </div>
        <ul class="nav">
            <li><a href="/dashboard"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li class="active"><a href="/expenses"><i class="fas fa-list"></i> Expenses</a></li>
            <li><a href="/add-expense"><i class="fas fa-plus-circle"></i> Add Expense</a></li>
            <li><a href="javascript:void(0)" onclick="return false;" style="cursor: default; opacity: 0.6;">
                <i class="fas fa-chart-pie"></i> Reports
            </a></li>
            <li class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="top-bar">
            <div class="greeting">
                <h1><span>All Expenses</span></h1>
                <p>View and manage your expenses</p>
            </div>
            <div class="user">
                <span class="name" id="userNameTop">User</span>
                <div class="avatar" id="userAvatar">U</div>
            </div>
        </div>

        <!-- Date Filter -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-group">
                    <span class="icon"><i class="fas fa-calendar-alt"></i></span>
                    <span class="label">From</span>
                    <input type="date" id="startDate" />
                </div>
                <div class="filter-group">
                    <span class="icon"><i class="fas fa-calendar-alt"></i></span>
                    <span class="label">To</span>
                    <input type="date" id="endDate" />
                </div>
                <button class="filter-btn apply" onclick="applyFilter()">
                    <i class="fas fa-filter"></i> Apply
                </button>
                <button class="filter-btn reset" onclick="resetFilter()">
                    <i class="fas fa-undo"></i> Reset
                </button>
                <div class="quick-filters">
                    <button class="quick-filter" onclick="setQuickFilter(7)">7D</button>
                    <button class="quick-filter" onclick="setQuickFilter(30)">30D</button>
                    <button class="quick-filter" onclick="setQuickFilter(90)">90D</button>
                    <button class="quick-filter" onclick="setQuickFilter(180)">6M</button>
                    <button class="quick-filter" onclick="setQuickFilter(365)">1Y</button>
                </div>
                <div class="filter-info">
                    Showing: <span id="dateRangeText">Current Month</span>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-header">
                <div class="title">📋 Expense List</div>
                <div class="total">Total: <span id="totalAmount">₹0</span></div>
            </div>
            <div id="expenseTable">
                <div class="loading-text">Loading expenses...</div>
            </div>
        </div>

    </div>

    <script>
        // ============================
        // 1. GET USER ID
        // ============================
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userName');

        if (!userId) {
            alert('Please login first!');
            window.location.href = '/login';
        }

        document.getElementById('userNameTop').textContent = userName || 'User';
        document.getElementById('userAvatar').textContent = (userName || 'U')[0].toUpperCase();

        // ============================
        // 2. DATE FILTER - DEFAULT CURRENT MONTH
        // ============================
        let currentStartDate = '';
        let currentEndDate = '';

        function formatLocalDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        function setDefaultDates() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);

            document.getElementById('startDate').value = formatLocalDate(firstDay);
            document.getElementById('endDate').value = formatLocalDate(today);

            currentStartDate = document.getElementById('startDate').value;
            currentEndDate = document.getElementById('endDate').value;

            const start = firstDay.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const end = today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('dateRangeText').textContent = start + ' — ' + end;

            document.querySelectorAll('.quick-filter').forEach(el => el.classList.remove('active'));
        }

        function setQuickFilter(days) {
            const today = new Date();
            const pastDate = new Date(today);
            pastDate.setDate(today.getDate() - days);

            document.getElementById('startDate').value = formatLocalDate(pastDate);
            document.getElementById('endDate').value = formatLocalDate(today);

            currentStartDate = document.getElementById('startDate').value;
            currentEndDate = document.getElementById('endDate').value;

            const start = pastDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const end = today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('dateRangeText').textContent = start + ' — ' + end;

            document.querySelectorAll('.quick-filter').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            loadExpenses(currentStartDate, currentEndDate);
        }

        setDefaultDates();

        // ============================
        // 3. LOAD EXPENSES
        // ============================
        async function loadExpenses(startDate, endDate) {
            const container = document.getElementById('expenseTable');
            container.innerHTML = '<div class="loading-text">Loading expenses...</div>';

            try {
                const body = { user_id: parseInt(userId) };
                if (startDate) body.start_date = startDate;
                if (endDate) body.end_date = endDate;

                const response = await fetch('/api/expenses/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    const expenses = result.data;
                    renderExpenses(expenses);
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error loading expenses</h3><p>' + result.message + '</p></div>';
                }
            } catch (error) {
                console.error('Error loading expenses:', error);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Network error</h3><p>Please try again</p></div>';
            }
        }

        // ============================
        // 4. RENDER EXPENSES
        // ============================
        function renderExpenses(expenses) {
            const container = document.getElementById('expenseTable');

            if (!expenses || expenses.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3>No expenses found</h3>
                        <p>Start adding your expenses to see them here</p>
                    </div>
                `;
                document.getElementById('totalAmount').textContent = '₹0';
                return;
            }

            let total = 0;
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th style="text-align: right;">Amount</th>
                            <th style="text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            expenses.forEach(exp => {
                total += exp.amount;
                const categoryClass = exp.category.toLowerCase();
                const date = new Date(exp.date);
                const formattedDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                html += `
                    <tr>
                        <td>${formattedDate}</td>
                        <td><span class="category-badge ${categoryClass}">${exp.category}</span></td>
                        <td>${exp.description}</td>
                        <td style="text-align: right;"><span class="amount negative">-₹${exp.amount.toFixed(2)}</span></td>
                        <td style="text-align: center;">
                            <button class="action-btn" onclick="editExpense(${exp.id})" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete" onclick="deleteExpense(${exp.id})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
            document.getElementById('totalAmount').textContent = '₹' + total.toFixed(2);
        }

        // ============================
        // 5. APPLY / RESET FILTER
        // ============================
        function applyFilter() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('Please select both dates');
                return;
            }
            if (startDate > endDate) {
                alert('Start date cannot be after end date');
                return;
            }

            currentStartDate = startDate;
            currentEndDate = endDate;

            document.querySelectorAll('.quick-filter').forEach(el => el.classList.remove('active'));

            const start = new Date(startDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const end = new Date(endDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('dateRangeText').textContent = start + ' — ' + end;

            loadExpenses(startDate, endDate);
        }

        function resetFilter() {
            setDefaultDates();
            document.querySelectorAll('.quick-filter').forEach(el => el.classList.remove('active'));

            loadExpenses(currentStartDate, currentEndDate);
        }

        // ============================
        // 6. EDIT / DELETE
        // ============================
        function editExpense(id) {
            alert('Edit expense ID: ' + id + ' (Coming soon!)');
        }

        function deleteExpense(id) {
            if (confirm('Are you sure you want to delete this expense?')) {
                fetch('/api/expense/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expense_id: id, user_id: parseInt(userId) })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        loadExpenses(currentStartDate, currentEndDate);
                    } else {
                        alert('Failed to delete: ' + data.message);
                    }
                })
                .catch(err => {
                    alert('Network error!');
                });
            }
        }

        // ============================
        // 7. LOGOUT
        // ============================
        function logout() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userName');
            window.location.href = '/login';
        }

        // ============================
        // 8. INITIAL LOAD
        // ============================
        loadExpenses(currentStartDate, currentEndDate);
    </script>

</body>
</html>
