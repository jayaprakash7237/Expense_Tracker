<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>💰 Expense Tracker - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0c0e1a;
            position: relative;
            overflow: hidden;
        }

        /* ============================
           PAGE LOADING OVERLAY
        ============================ */
        #pageLoader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0c0e1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #pageLoader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 44px;
            height: 44px;
            border: 2.5px solid rgba(255, 255, 255, 0.03);
            border-top: 2.5px solid #a78bfa;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 14px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .loader-text span {
            color: #a78bfa;
        }

        /* ============================
           BACKGROUND
        ============================ */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0c0e1a, #1a0e2e, #0c1a2e);
            opacity: 0;
            animation: bgFadeIn 1s ease forwards;
            animation-delay: 0.3s;
        }

        @keyframes bgFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            animation: orbMove 20s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.08);
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 350px;
            height: 350px;
            background: rgba(236, 72, 153, 0.06);
            bottom: -15%;
            right: -10%;
            animation-delay: -6s;
        }

        .orb:nth-child(3) {
            width: 280px;
            height: 280px;
            background: rgba(52, 211, 153, 0.05);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -12s;
        }

        @keyframes orbMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 30px) scale(0.9); }
        }

        .symbol {
            position: absolute;
            font-size: 50px;
            opacity: 0;
            animation: floatSymbol 25s ease-in-out infinite;
            pointer-events: none;
        }

        .symbol:nth-child(4) { top: 10%; left: 8%; animation-delay: 0.2s; font-size: 65px; }
        .symbol:nth-child(5) { top: 20%; right: 12%; animation-delay: 0.4s; font-size: 80px; }
        .symbol:nth-child(6) { bottom: 25%; left: 5%; animation-delay: 0.6s; font-size: 55px; }
        .symbol:nth-child(7) { bottom: 15%; right: 8%; animation-delay: 0.8s; font-size: 70px; }
        .symbol:nth-child(8) { top: 50%; left: 50%; animation-delay: 1s; font-size: 95px; transform: translateX(-50%); }

        @keyframes floatSymbol {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.02; }
            50% { transform: translateY(-30px) rotate(10deg) scale(1.05); opacity: 0.05; }
        }

        .grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.008) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.008) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0;
            animation: gridFadeIn 1.2s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes gridFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ============================
           REGISTER CARD - SMALLER
        ============================ */
        .register-card {
            position: relative;
            z-index: 1;
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 60px 120px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            animation: cardSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.4s;
        }

        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .register-card:hover {
            border-color: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        /* ============================
           HEADER - SMALLER
        ============================ */
        .header {
            text-align: center;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
            animation-delay: 0.6s;
        }

        .header .icon-wrap {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25); }
            50% { box-shadow: 0 10px 50px rgba(99, 102, 241, 0.4); }
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .header h1 .highlight {
            background: linear-gradient(135deg, #6366f1, #ec4899, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            margin-top: 2px;
        }

        /* ============================
           FORM - SMALLER
        ============================ */
        .form-group {
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.55s; }
        .form-group:nth-child(2) { animation-delay: 0.6s; }
        .form-group:nth-child(3) { animation-delay: 0.65s; }
        .form-group:nth-child(4) { animation-delay: 0.7s; }
        .form-group:nth-child(5) { animation-delay: 0.75s; }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .input-wrap:focus-within {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.04);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.06);
        }

        .input-wrap .icon {
            padding: 0 0 0 10px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            flex-shrink: 0;
        }

        .input-wrap:focus-within .icon {
            color: #a78bfa;
        }

        .input-wrap input {
            width: 100%;
            padding: 9px 10px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 12px;
            font-weight: 400;
            font-family: 'Inter', sans-serif;
        }

        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.06);
            font-weight: 300;
        }

        .phone-wrap {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .phone-wrap:focus-within {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.04);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.06);
        }

        .phone-wrap .country-code {
            padding: 0 0 0 10px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .phone-wrap .icon {
            padding-left: 4px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            flex-shrink: 0;
        }

        .phone-wrap:focus-within .icon {
            color: #a78bfa;
        }

        .phone-wrap input {
            width: 100%;
            padding: 9px 10px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 12px;
            font-weight: 400;
            font-family: 'Inter', sans-serif;
        }

        .phone-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.06);
            font-weight: 300;
        }

        .toggle-pass {
            padding-right: 10px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.08);
            transition: color 0.3s ease;
            flex-shrink: 0;
            font-size: 12px;
        }

        .toggle-pass:hover {
            color: rgba(255, 255, 255, 0.25);
        }

        .pass-hint {
            margin-top: 3px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pass-hint .valid { color: #34d399; }
        .pass-hint .invalid { color: #f87171; }
        .pass-hint i { font-size: 8px; }

        /* ============================
           SUBMIT BUTTON - SMALLER
        ============================ */
        .submit-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #6366f1, #a78bfa, #ec4899);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
            animation-delay: 0.8s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .submit-btn i {
            margin-right: 8px;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .submit-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .submit-btn.loading .btn-text { display: none; }
        .submit-btn.loading .spinner { display: block; }

        /* ============================
           FOOTER - SMALLER
        ============================ */
        .footer {
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
            animation-delay: 0.85s;
        }

        .footer a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ec4899;
        }

        /* ============================
           MESSAGES - SMALLER
        ============================ */
        .msg {
            display: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 10px;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.4s ease;
        }

        .msg i { font-size: 14px; }
        .msg.show {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .msg-success {
            background: rgba(52, 211, 153, 0.06);
            border: 1px solid rgba(52, 211, 153, 0.08);
            color: #34d399;
        }

        .msg-error {
            background: rgba(248, 113, 113, 0.06);
            border: 1px solid rgba(248, 113, 113, 0.08);
            color: #f87171;
        }

        /* ============================
           RESPONSIVE
        ============================ */
        @media (max-width: 480px) {
            .register-card {
                padding: 24px 16px;
                border-radius: 24px;
                max-width: 100%;
            }
            .header h1 {
                font-size: 18px;
            }
            .header .icon-wrap {
                width: 40px;
                height: 40px;
                font-size: 17px;
            }
            .header {
                margin-bottom: 18px;
            }
            .form-group {
                margin-bottom: 8px;
            }
            .form-group input {
                padding: 8px 8px;
                font-size: 11px;
            }
            .submit-btn {
                padding: 10px;
                font-size: 12px;
            }
            .footer {
                font-size: 11px;
                margin-top: 14px;
            }
            .msg {
                padding: 6px 10px;
                font-size: 11px;
            }
        }

        @media (max-height: 700px) {
            .register-card {
                padding: 22px 20px;
            }
            .header {
                margin-bottom: 16px;
            }
            .header .icon-wrap {
                width: 38px;
                height: 38px;
                font-size: 16px;
                margin-bottom: 6px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header p {
                font-size: 11px;
            }
            .form-group {
                margin-bottom: 6px;
            }
            .form-group input {
                padding: 7px 8px;
                font-size: 11px;
            }
            .form-group label {
                font-size: 9px;
            }
            .submit-btn {
                padding: 8px;
                font-size: 12px;
                margin-top: 4px;
            }
            .footer {
                margin-top: 10px;
                font-size: 11px;
            }
            .msg {
                padding: 6px 10px;
                font-size: 11px;
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================
    PAGE LOADER
    ============================ -->
    <div id="pageLoader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading <span>Expense Tracker</span></div>
    </div>

    <!-- ============================
    BACKGROUND
    ============================ -->
    <div class="bg-layer">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="symbol">$</div>
        <div class="symbol">€</div>
        <div class="symbol">£</div>
        <div class="symbol">¥</div>
        <div class="symbol">$</div>
    </div>
    <div class="grid"></div>

    <!-- ============================
    REGISTER CARD - SMALLER
    ============================ -->
    <div class="register-card">

        <div class="header">
            <div class="icon-wrap">
                <i class="fas fa-wallet"></i>
            </div>
            <h1>Create <span class="highlight">Account</span></h1>
            <p>Start tracking your expenses</p>
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrap">
                    <span class="icon"><i class="fas fa-user"></i></span>
                    <input type="text" id="name" placeholder="John Doe" required />
                </div>
            </div>

            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <span class="icon"><i class="fas fa-at"></i></span>
                    <input type="text" id="username" placeholder="johndoe" required />
                </div>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <div class="phone-wrap">
                    <span class="country-code">+91</span>
                    <span class="icon"><i class="fas fa-phone"></i></span>
                    <input type="tel" id="mobile" placeholder="98765 43210" required />
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6" />
                    <span class="toggle-pass" onclick="togglePass()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
                <div class="pass-hint">
                    <span id="lengthReq" class="invalid">
                        <i class="fas fa-circle"></i> At least 6 characters
                    </span>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="registerBtn">
                <span class="btn-text"><i class="fas fa-user-plus"></i> Create Account</span>
                <div class="spinner"></div>
            </button>

            <div class="msg msg-success" id="successMsg">
                <i class="fas fa-check-circle"></i>
                <span id="successText">Account created! 🎉</span>
            </div>

            <div class="msg msg-error" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Something went wrong!</span>
            </div>

        </form>

        <div class="footer">
            Already have an account? <a href="/login">Sign In</a>
        </div>

    </div>

    <script>
        // ============================
        // 1. PAGE LOADER
        // ============================
        const pageLoader = document.getElementById('pageLoader');

        window.addEventListener('load', function() {
            setTimeout(() => {
                pageLoader.classList.add('hidden');
            }, 400);
        });

        setTimeout(() => {
            if (!pageLoader.classList.contains('hidden')) {
                pageLoader.classList.add('hidden');
            }
        }, 2500);

        // ============================
        // 2. TOGGLE PASSWORD
        // ============================
        function togglePass() {
            const pass = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (pass.type === 'password') {
                pass.type = 'text';
                eye.className = 'fas fa-eye-slash';
            } else {
                pass.type = 'password';
                eye.className = 'fas fa-eye';
            }
        }

        document.getElementById('password').addEventListener('input', function() {
            const el = document.getElementById('lengthReq');
            if (this.value.length >= 6) {
                el.className = 'valid';
                el.innerHTML = '<i class="fas fa-check-circle"></i> At least 6 characters';
            } else {
                el.className = 'invalid';
                el.innerHTML = '<i class="fas fa-circle"></i> At least 6 characters';
            }
        });

        // ============================
        // 3. REGISTER FORM
        // ============================
        const form = document.getElementById('registerForm');
        const btn = document.getElementById('registerBtn');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            successMsg.classList.remove('show');
            errorMsg.classList.remove('show');

            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!name || !username || !mobile || !email || !password) {
                showError('All fields are required!');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters!');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username, mobile, email, password })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    // showSuccess(data.message);
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showError(data.message);
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            } catch {
                showError('Network error! Please try again.');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        function showSuccess(msg) {
            document.getElementById('successText').textContent = msg;
            successMsg.classList.add('show');
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            errorMsg.classList.add('show');
            setTimeout(() => errorMsg.classList.remove('show'), 5000);
        }
    </script>

</body>
</html>
