<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>💰 Expense Tracker - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0c0e1a;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* ============================
           LOADING OVERLAY - Minimal
        ============================ */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0c0e1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Simple pulse circle */
        .loader-pulse {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            animation: pulse 1.2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.15);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.85);
                opacity: 0.5;
            }
        }

        .loader-text {
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .loader-text span {
            color: #a78bfa;
        }

        /* Progress bar */
        .loader-progress {
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            margin-top: 16px;
            overflow: hidden;
        }

        .loader-progress .bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            border-radius: 4px;
            animation: progress 2s ease-in-out forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            20% { width: 20%; }
            40% { width: 45%; }
            60% { width: 70%; }
            80% { width: 88%; }
            100% { width: 100%; }
        }

        /* ============================
           SIDEBAR
        ============================ */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            padding: 28px 20px;
            z-index: 100;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .sidebar .logo .icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }

        .sidebar .logo h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar .logo h2 span {
            font-weight: 300;
            opacity: 0.7;
        }

        .sidebar .nav {
            list-style: none;
        }

        .sidebar .nav li {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 4px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar .nav li i {
            width: 20px;
            font-size: 16px;
        }

        .sidebar .nav li:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.8);
        }

        .sidebar .nav li.active {
            background: rgba(99, 102, 241, 0.12);
            color: #a78bfa;
            border: 1px solid rgba(99, 102, 241, 0.08);
        }

        .sidebar .nav li.logout {
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
            color: rgba(255, 255, 255, 0.3);
        }

        .sidebar .nav li.logout:hover {
            color: #f87171;
        }

        /* ============================
           MAIN CONTENT
        ============================ */
        .main-content {
            margin-left: 240px;
            padding: 32px 40px 40px 40px;
            min-height: 100vh;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 0.4s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .top-bar .greeting h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .top-bar .greeting h1 span {
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .top-bar .greeting p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            margin-top: 2px;
        }

        .top-bar .user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar .user .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .top-bar .user .name {
            font-size: 14px;
            font-weight: 500;
        }

        /* ============================
           STATS CARDS
        ============================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .stat-card .label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 6px;
        }

        .stat-card .change {
            font-size: 12px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-card .change.positive { color: #34d399; }
        .stat-card .change.negative { color: #f87171; }

        .stat-card .icon {
            float: right;
            font-size: 32px;
            opacity: 0.06;
            margin-top: -8px;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 24px;
        }

        .chart-box, .recent-box {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
        }

        .chart-box .title, .recent-box .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            height: 180px;
            padding-top: 8px;
        }

        .bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .bar-item .bar {
            width: 100%;
            max-width: 36px;
            border-radius: 6px 6px 0 0;
            background: linear-gradient(180deg, #6366f1, #a78bfa);
            transition: height 0.6s ease;
            min-height: 8px;
        }

        .bar-item .bar-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction .left .icon-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .transaction .left .icon-circle.income { background: rgba(52, 211, 153, 0.1); color: #34d399; }
        .transaction .left .icon-circle.expense { background: rgba(248, 113, 113, 0.1); color: #f87171; }
        .transaction .left .icon-circle.food { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
        .transaction .left .icon-circle.bills { background: rgba(99, 102, 241, 0.1); color: #a78bfa; }

        .transaction .left .info .title {
            font-size: 14px;
            font-weight: 500;
        }

        .transaction .left .info .sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .transaction .amount {
            font-weight: 600;
            font-size: 14px;
        }

        .transaction .amount.positive { color: #34d399; }
        .transaction .amount.negative { color: #f87171; }

        .fab {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
            z-index: 50;
        }

        .fab:hover {
            transform: scale(1.05);
            box-shadow: 0 16px 48px rgba(99, 102, 241, 0.45);
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-text {
            height: 28px;
            width: 80%;
            margin-top: 6px;
        }

        .skeleton-change {
            height: 16px;
            width: 60%;
            margin-top: 6px;
        }

        .skeleton-chart {
            height: 180px;
            width: 100%;
            border-radius: 8px;
        }

        .skeleton-transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .skeleton-transaction .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .skeleton-transaction .left .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .skeleton-transaction .left .text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .skeleton-transaction .left .text .line1 {
            height: 14px;
            width: 120px;
        }

        .skeleton-transaction .left .text .line2 {
            height: 12px;
            width: 80px;
        }

        .skeleton-transaction .right {
            height: 14px;
            width: 60px;
        }

        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .bottom-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================
    LOADING OVERLAY - Minimal
    ============================ -->
    <div id="loadingOverlay">
        <div class="loader-pulse"></div>
        <div class="loader-text">Loading <span>Dashboard</span></div>
        <div class="loader-progress">
            <div class="bar"></div>
        </div>
    </div>

    <!-- ============================
    SIDEBAR
    ============================ -->
    <div class="sidebar">
        <div class="logo">
            <div class="icon"><i class="fas fa-wallet"></i></div>
            <h2>Expense<span>Tracker</span></h2>
        </div>
        <ul class="nav">
            <li class="active"><i class="fas fa-th-large"></i> Dashboard</li>
            <li><i class="fas fa-list"></i> Expenses</li>
            <li><i class="fas fa-plus-circle"></i> Add Expense</li>
            <li><i class="fas fa-chart-pie"></i> Reports</li>
            <li class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</li>
        </ul>
    </div>

    <!-- ============================
    MAIN CONTENT
    ============================ -->
    <div class="main-content">

        <div class="top-bar">
            <div class="greeting">
                <h1>Good Morning, <span id="userName">User</span></h1>
                <p>Here's your expense summary</p>
            </div>
            <div class="user">
                <span class="name" id="userNameTop">User</span>
                <div class="avatar" id="userAvatar">U</div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="icon"><i class="fas fa-coins"></i></div>
                <div class="label">Total Expenses</div>
                <div class="value" id="totalExpenses">
                    <div class="skeleton skeleton-text"></div>
                </div>
                <div class="change" id="totalChange">
                    <div class="skeleton skeleton-change"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon"><i class="fas fa-trend-up"></i></div>
                <div class="label">This Month</div>
                <div class="value" id="thisMonth">
                    <div class="skeleton skeleton-text"></div>
                </div>
                <div class="change" id="monthChange">
                    <div class="skeleton skeleton-change"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon"><i class="fas fa-wallet"></i></div>
                <div class="label">Remaining Budget</div>
                <div class="value" id="remainingBudget">
                    <div class="skeleton skeleton-text"></div>
                </div>
                <div class="change" id="budgetChange">
                    <div class="skeleton skeleton-change"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon"><i class="fas fa-calendar"></i></div>
                <div class="label">Transactions</div>
                <div class="value" id="transactions">
                    <div class="skeleton skeleton-text"></div>
                </div>
                <div class="change" id="transactionChange">
                    <div class="skeleton skeleton-change"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Grid -->
        <div class="bottom-grid">

            <div class="chart-box">
                <div class="title">📊 Weekly Spending</div>
                <div id="chartContainer">
                    <div class="skeleton skeleton-chart"></div>
                </div>
            </div>

            <div class="recent-box">
                <div class="title">🕒 Recent Transactions</div>
                <div id="recentTransactions">
                    <div class="skeleton-transaction">
                        <div class="left">
                            <div class="skeleton circle"></div>
                            <div class="text">
                                <div class="skeleton line1"></div>
                                <div class="skeleton line2"></div>
                            </div>
                        </div>
                        <div class="skeleton right"></div>
                    </div>
                    <div class="skeleton-transaction">
                        <div class="left">
                            <div class="skeleton circle"></div>
                            <div class="text">
                                <div class="skeleton line1"></div>
                                <div class="skeleton line2"></div>
                            </div>
                        </div>
                        <div class="skeleton right"></div>
                    </div>
                    <div class="skeleton-transaction">
                        <div class="left">
                            <div class="skeleton circle"></div>
                            <div class="text">
                                <div class="skeleton line1"></div>
                                <div class="skeleton line2"></div>
                            </div>
                        </div>
                        <div class="skeleton right"></div>
                    </div>
                    <div class="skeleton-transaction">
                        <div class="left">
                            <div class="skeleton circle"></div>
                            <div class="text">
                                <div class="skeleton line1"></div>
                                <div class="skeleton line2"></div>
                            </div>
                        </div>
                        <div class="skeleton right"></div>
                    </div>
                    <div class="skeleton-transaction">
                        <div class="left">
                            <div class="skeleton circle"></div>
                            <div class="text">
                                <div class="skeleton line1"></div>
                                <div class="skeleton line2"></div>
                            </div>
                        </div>
                        <div class="skeleton right"></div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <button class="fab" onclick="alert('Add Expense Coming Soon! 🚀')">
        <i class="fas fa-plus"></i>
    </button>

    <script>
        // ============================
        // 1. Show Loading Overlay
        // ============================
        const loadingOverlay = document.getElementById('loadingOverlay');
        const minLoadingTime = 2000;

        // ============================
        // 2. Get userId
        // ============================
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userName');

        if (!userId) {
            alert('Please login first!');
            window.location.href = '/login';
        }

        document.getElementById('userName').textContent = userName || 'User';
        document.getElementById('userNameTop').textContent = userName || 'User';
        document.getElementById('userAvatar').textContent = (userName || 'U')[0].toUpperCase();

        // ============================
        // 3. Load Data
        // ============================
        async function loadStats() {
            try {
                const response = await fetch('/api/dashboard/stats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId) })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    const data = result.data;

                    document.getElementById('totalExpenses').innerHTML = '₹' + data.totalExpenses;
                    document.getElementById('thisMonth').innerHTML = '₹' + data.thisMonth;
                    document.getElementById('remainingBudget').innerHTML = '₹' + data.remainingBudget;
                    document.getElementById('transactions').innerHTML = data.transactions;

                    if (data.monthlyChangeType === 'positive') {
                        document.getElementById('totalChange').className = 'change positive';
                        document.getElementById('totalChange').innerHTML = '<i class="fas fa-arrow-up"></i> ' + data.monthlyChange + '% from last month';
                    } else {
                        document.getElementById('totalChange').className = 'change negative';
                        document.getElementById('totalChange').innerHTML = '<i class="fas fa-arrow-down"></i> ' + Math.abs(data.monthlyChange) + '% from last month';
                    }

                    document.getElementById('monthChange').className = 'change positive';
                    document.getElementById('monthChange').innerHTML = '<i class="fas fa-arrow-up"></i> Current month';
                    document.getElementById('budgetChange').className = 'change positive';
                    document.getElementById('budgetChange').innerHTML = '<i class="fas fa-arrow-up"></i> Budget remaining';
                    document.getElementById('transactionChange').className = 'change positive';
                    document.getElementById('transactionChange').innerHTML = '<i class="fas fa-arrow-up"></i> Total transactions';

                    hideLoading();
                }
            } catch (error) {
                console.error('Error loading stats:', error);
                hideLoading();
            }
        }

        async function loadChart() {
            try {
                const response = await fetch('/api/dashboard/chart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId) })
                });

                const result = await response.json();
                const container = document.getElementById('chartContainer');

                if (result.status === 'success') {
                    const chartData = result.data;
                    if (chartData.labels && chartData.labels.length > 0) {
                        let html = '<div class="bar-chart">';
                        const maxValue = Math.max(...chartData.data, 1);
                        for (let i = 0; i < chartData.labels.length; i++) {
                            const height = (chartData.data[i] / maxValue) * 150;
                            html += `
                                <div class="bar-item">
                                    <div class="bar" style="height: ${Math.max(height, 10)}px;"></div>
                                    <span class="bar-label">${chartData.labels[i]}</span>
                                </div>
                            `;
                        }
                        html += '</div>';
                        container.innerHTML = html;
                    } else {
                        container.innerHTML = '<div class="loading-text">No data available</div>';
                    }
                }
            } catch (error) {
                console.error('Error loading chart:', error);
            }
        }

        async function loadRecentTransactions() {
            try {
                const response = await fetch('/api/dashboard/recent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId) })
                });

                const result = await response.json();
                const container = document.getElementById('recentTransactions');

                if (result.status === 'success') {
                    const transactions = result.data;
                    if (transactions && transactions.length > 0) {
                        let html = '';
                        transactions.forEach(t => {
                            const amountClass = t.type === 'income' ? 'positive' : 'negative';
                            const sign = t.type === 'income' ? '+' : '-';
                            html += `
                                <div class="transaction">
                                    <div class="left">
                                        <div class="icon-circle ${t.icon}">
                                            <i class="fas ${getIconClass(t.icon)}"></i>
                                        </div>
                                        <div class="info">
                                            <div class="title">${t.description}</div>
                                            <div class="sub">${t.date}</div>
                                        </div>
                                    </div>
                                    <div class="amount ${amountClass}">${sign}₹${t.amount}</div>
                                </div>
                            `;
                        });
                        container.innerHTML = html;
                    } else {
                        container.innerHTML = '<div class="loading-text">No transactions</div>';
                    }
                }
            } catch (error) {
                console.error('Error loading transactions:', error);
            }
        }

        function getIconClass(icon) {
            const map = {
                'food': 'fa-utensils',
                'bills': 'fa-bolt',
                'expense': 'fa-shopping-bag',
                'income': 'fa-arrow-right',
                'shopping': 'fa-shopping-bag'
            };
            return map[icon] || 'fa-circle';
        }

        // ============================
        // 4. Hide Loading
        // ============================
        let startTime = Date.now();

        function hideLoading() {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, minLoadingTime - elapsed);

            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, remaining);
        }

        // ============================
        // 5. Logout
        // ============================
        function logout() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userName');
            window.location.href = '/login';
        }

        // ============================
        // 6. Load Everything
        // ============================
        loadStats();
        loadChart();
        loadRecentTransactions();
    </script>

</body>
</html>
